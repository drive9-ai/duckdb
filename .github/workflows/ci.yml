name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DUCKDB_VERSION: v1.4.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-openssl-dev unzip
      - name: Install matching DuckDB CLI and C++ headers
        run: |
          mkdir -p "$RUNNER_TEMP/duckdb/bin" "$RUNNER_TEMP/duckdb/source" "$RUNNER_TEMP/duckdb/lib"
          curl -fsSL --retry 3 "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" -o "$RUNNER_TEMP/duckdb/cli.zip"
          printf '%s  %s\n' fae3ba93eedf20b08bca4b23aeac1ba94c446f1c10d029c193e2fc4b4e0bc1bc "$RUNNER_TEMP/duckdb/cli.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/duckdb/cli.zip" -d "$RUNNER_TEMP/duckdb/bin"
          chmod +x "$RUNNER_TEMP/duckdb/bin/duckdb"
          curl -fsSL --retry 3 "https://github.com/duckdb/duckdb/archive/refs/tags/${DUCKDB_VERSION}.tar.gz" -o "$RUNNER_TEMP/duckdb/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/duckdb/source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/duckdb/source"
          curl -fsSL --retry 3 "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" -o "$RUNNER_TEMP/duckdb/lib.zip"
          printf '%s  %s\n' 0a68e623cbdcfa06e10e1b5d6a3092d3fd3679f616008fb1a39b92e4a10d8f43 "$RUNNER_TEMP/duckdb/lib.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/duckdb/lib.zip" libduckdb_static.a -d "$RUNNER_TEMP/duckdb/lib"
          printf 'DUCKDB=%s\nDUCKDB_INCLUDE=%s\nDUCKDB_STATIC_LIBRARY=%s\n' "$RUNNER_TEMP/duckdb/bin/duckdb" "$RUNNER_TEMP/duckdb/source/src/include" "$RUNNER_TEMP/duckdb/lib/libduckdb_static.a" >> "$GITHUB_ENV"
      - name: Build, load, and test the native extension
        run: make test
